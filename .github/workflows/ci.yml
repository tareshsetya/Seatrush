name: SeatRush CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test-and-build:
    name: Backend CI (Node.js, Postgres & Concurrency Tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seatrush
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: seatrush_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck Backend
        working-directory: backend
        run: npx tsc --noEmit

      - name: Run Concurrency & State Machine Unit Tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://seatrush:password123@localhost:5432/seatrush_db
          DEMO_CHECKOUT_ENABLED: "true"
          REDIS_URL: redis://localhost:6379
        run: npm test

      - name: Build Production Backend
        working-directory: backend
        run: npm run build

  frontend-build:
    name: Frontend CI (React, TypeScript & Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build
